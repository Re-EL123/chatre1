<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chatre LLM | Maerd</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700;1,9..40,400&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-dark.min.css">
    <style>
      :root {
        --primary-color: #fff;
        --primary-hover: #ccc;
        --light-bg: #050508;
        --border-color: #2a2a32;
        --text-color: #f2f2f5;
        --text-light: #8b8b97;
        --user-msg-bg: rgba(39, 56, 82, 0.85);
        --assistant-msg-bg: rgba(20, 22, 44, 0.8);
        --code-bg: #0c0c12;
        --accent: linear-gradient(
          270deg,
          #e85d4c,
          #e8a84c,
          #4cb8e8,
          #6c5ce7
        );
      }

      * {
        box-sizing: border-box;
      }

      body {
        font-family: "DM Sans", system-ui, sans-serif;
        line-height: 1.6;
        color: var(--text-color);
        background:
          radial-gradient(ellipse at top, #12122a 0%, transparent 55%),
          var(--light-bg);
        max-width: 800px;
        margin: 0 auto;
        padding: 1rem;
        min-height: 100vh;
      }

      .spectrum-strip {
        height: 4px;
        background: var(--accent);
        background-size: 400% 400%;
        animation: slide 8s ease infinite;
        border-radius: 2px;
      }

      @keyframes slide {
        0% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
        100% {
          background-position: 0% 50%;
        }
      }

      header {
        text-align: center;
        margin-bottom: 1rem;
        padding: 1rem 0;
        border-bottom: 1px solid var(--border-color);
      }

      h1 {
        font-size: 1.75rem;
        letter-spacing: 0.08em;
        margin: 0 0 0.35rem;
      }

      header p {
        margin: 0;
        color: var(--text-light);
        font-size: 0.95rem;
      }

      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        align-items: center;
        margin-bottom: 0.75rem;
      }

      .toolbar label {
        font-size: 0.85rem;
        color: var(--text-light);
      }

      #model-select {
        flex: 1;
        min-width: 180px;
        background: #0a0a10;
        color: var(--text-color);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        padding: 0.45rem 0.6rem;
        font: inherit;
      }

      .hint {
        width: 100%;
        font-size: 0.8rem;
        color: var(--text-light);
        margin: 0;
      }

      .chat-container {
        display: flex;
        flex-direction: column;
        height: calc(100vh - 260px);
        min-height: 400px;
        border: 1.5px solid var(--border-color);
        border-radius: 16px;
        overflow: hidden;
        background: rgba(20, 22, 44, 0.7);
        box-shadow: 0 8px 40px #16161a;
        backdrop-filter: blur(8px);
      }

      .chat-messages {
        flex: 1;
        overflow-y: auto;
        padding: 1rem;
        background: linear-gradient(120deg, #000 60%, #111 100%);
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
      }

      .message {
        margin-bottom: 0.75rem;
        padding: 0.95rem;
        border-radius: 12px;
        max-width: 85%;
        font-size: 1.02rem;
        word-wrap: break-word;
        overflow-wrap: anywhere;
      }

      .user-message {
        background: var(--user-msg-bg);
        align-self: flex-end;
        margin-left: auto;
        color: #eaf2fb;
      }

      .assistant-message {
        background: var(--assistant-msg-bg);
        align-self: flex-start;
        color: #bbc8e7;
        animation: fadeInUp 0.45s ease;
      }

      .assistant-message.streaming::after {
        content: "▍
        animation: blink 1s step-end infinite;
        margin-left: 2px;
        opacity: 0.7;
      }

      @keyframes blink {
        50% {
          opacity: 0;
        }
      }

      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .message p {
        margin: 0 0 0.65rem;
      }

      .message p:last-child {
        margin-bottom: 0;
      }

      .message ul,
      .message ol {
        margin: 0.4rem 0 0.65rem 1.2rem;
        padding: 0;
      }

      .message pre {
        position: relative;
        background: var(--code-bg);
        border: 1px solid var(--border-color);
        border-radius: 10px;
        padding: 0.85rem 1rem;
        overflow-x: auto;
        margin: 0.65rem 0;
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        font-size: 0.88rem;
        line-height: 1.45;
      }

      .message code {
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        font-size: 0.9em;
        background: rgba(255, 255, 255, 0.06);
        padding: 0.1em 0.35em;
        border-radius: 4px;
      }

      .message pre code {
        background: none;
        padding: 0;
        font-size: inherit;
        color: #d7dce8;
      }

      .code-copy {
        position: absolute;
        top: 0.45rem;
        right: 0.45rem;
        font: inherit;
        font-size: 0.72rem;
        padding: 0.2rem 0.45rem;
        border-radius: 6px;
        border: 1px solid var(--border-color);
        background: #1a1a24;
        color: var(--text-light);
        cursor: pointer;
      }

      .code-copy:hover {
        color: #fff;
        border-color: #555;
      }

      .message img.generated-image {
        display: block;
        max-width: min(100%, 420px);
        border-radius: 12px;
        margin-top: 0.5rem;
      }

      .message-input {
        display: flex;
        gap: 0.5rem;
        padding: 0.75rem;
        border-top: 1px solid var(--border-color);
        background: rgba(15, 23, 42, 0.9);
        align-items: flex-end;
      }

      #user-input {
        flex: 1;
        padding: 0.75rem;
        border: 1.5px solid var(--border-color);
        border-radius: 8px;
        background: #000;
        color: var(--text-color);
        resize: none;
        min-height: 44px;
        max-height: 160px;
        outline: none;
        font: inherit;
      }

      #user-input:focus {
        border-color: #6c8cff;
      }

      .btn {
        padding: 0 1rem;
        min-height: 44px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
        font-size: 0.95rem;
        font-family: inherit;
      }

      #send-button {
        background: var(--accent);
        background-size: 200% 200%;
        color: #fff;
      }

      #send-button:disabled {
        background: #222;
        color: #666;
        cursor: not-allowed;
      }

      #stop-button {
        display: none;
        background: #3a1520;
        color: #ffb4c0;
        border: 1px solid #6a2a3a;
      }

      #stop-button.visible {
        display: inline-flex;
        align-items: center;
      }

      #image-mode-button {
        background: #12121c;
        color: var(--text-light);
        border: 1px solid var(--border-color);
      }

      #image-mode-button.active {
        color: #9fd4ff;
        border-color: #3a6a9a;
        background: #0e1a28;
      }

      .typing-indicator {
        display: none;
        padding: 0 1rem 0.5rem;
        font-style: italic;
        color: var(--text-light);
        font-size: 0.9rem;
      }

      .typing-indicator.visible {
        display: block;
      }

      footer {
        margin-top: 1rem;
        text-align: center;
        font-size: 0.9rem;
        color: var(--text-light);
      }

      .chat-container.processing {
        box-shadow: 0 0 25px rgba(108, 140, 255, 0.25), 0 8px 40px #16161a;
        border-color: rgba(108, 140, 255, 0.5);
        animation: containerPulse 2s infinite ease-in-out;
      }

      @keyframes containerPulse {
        0%, 100% { border-color: rgba(108, 140, 255, 0.3); }
        50% { border-color: rgba(108, 140, 255, 0.7); }
      }

      .slash-suggestions {
        position: absolute;
        bottom: 100%;
        left: 0.75rem;
        right: 0.75rem;
        background: #141422;
        border: 1px solid var(--border-color);
        border-radius: 10px;
        box-shadow: 0 -8px 24px rgba(0,0,0,0.6);
        overflow: hidden;
        z-index: 100;
        max-height: 220px;
        overflow-y: auto;
        display: none;
        margin-bottom: 0.5rem;
      }

      .slash-suggestion-item {
        padding: 0.65rem 1rem;
        cursor: pointer;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 0.9rem;
        border-bottom: 1px solid rgba(255,255,255,0.04);
      }

      .slash-suggestion-item:hover, .slash-suggestion-item.active {
        background: rgba(108, 140, 255, 0.2);
        color: #fff;
      }

      .slash-suggestion-item code {
        color: #9fd4ff;
        font-family: "IBM Plex Mono", monospace;
        font-weight: 500;
      }

      .slash-suggestion-item span {
        color: var(--text-light);
        font-size: 0.8rem;
      }

      .suggestion-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem;
        margin-top: 0.75rem;
      }

      .suggestion-chip {
        background: rgba(108, 140, 255, 0.12);
        border: 1px solid rgba(108, 140, 255, 0.3);
        color: #b8d0ff;
        padding: 0.35rem 0.75rem;
        border-radius: 16px;
        font-size: 0.85rem;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .suggestion-chip:hover {
        background: rgba(108, 140, 255, 0.25);
        border-color: #6c8cff;
        color: #fff;
        transform: translateY(-1px);
      }

      .spinner {
        display: inline-block;
        width: 14px;
        height: 14px;
        border: 2px solid rgba(255,255,255,0.3);
        border-radius: 50%;
        border-top-color: #fff;
        animation: spin 0.8s linear infinite;
        margin-right: 6px;
        vertical-align: middle;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      @media (max-width: 560px) {
        .message {
          max-width: 95%;
        }
        .chat-container {
          height: calc(100vh - 300px);
        }
      }
    </style>
  </head>
  <body>
    <div class="spectrum-strip"></div>
    <header>
      <h1>Chatre</h1>
      <p>Re-EL AI ChatBot (Maerd Portal)</p>
    </header>

    <div class="toolbar">
      <label for="model-select">Model</label>
      <select id="model-select" aria-label="Model">
        <option value="@cf/meta/llama-3.3-70b-instruct-fp8-fast">
          Llama 3.3 70B (default)
        </option>
        <option value="@cf/meta/llama-3.1-8b-instruct-fp8-fast">
          Llama 3.1 8B Fast
        </option>
        <option value="@cf/meta/llama-3.1-8b-instruct">Llama 3.1 8B</option>
        <option value="@cf/meta/llama-3.2-3b-instruct">Llama 3.2 3B</option>
      </select>
      <button type="button" class="btn" id="image-mode-button" title="Toggle image mode">
        Image
      </button>
      <p class="hint">
        Chat streams by default. For images, turn on Image mode or start with
        <code>/image</code>. Press Stop to abort generation.
      </p>
    </div>

    <div class="chat-container">
      <div id="chat-messages" class="chat-messages" role="log" aria-live="polite"></div>
      <div class="typing-indicator" id="typing-indicator" aria-hidden="true"></div>
      <div class="message-input" style="position: relative;">
        <div id="slash-suggestions" class="slash-suggestions"></div>
        <textarea
          id="user-input"
          placeholder="Type a message… or /image a sunset over Cape Town"
          rows="1"
          autofocus
        ></textarea>
        <button type="button" class="btn" id="stop-button">Stop</button>
        <button type="button" class="btn" id="send-button">Send</button>
      </div>
    </div>

    <footer>
      <p>Re-EL Technologies &copy; 2025</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.4/dist/purify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
    <script src="/chat.js" defer></script>
  </body>
</html>
