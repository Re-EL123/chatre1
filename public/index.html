<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chatre LLM | Maerd</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700;1,9..40,400&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-dark.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tippy.js@6.3.7/dist/tippy.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tippy.js@6.3.7/animations/shift-away-subtle.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/notyf@3.10.0/notyf.min.css">
    <style>
      :root {
        --primary-color: #fff;
        --primary-hover: #ccc;
        --light-bg: #050508;
        --border-color: #2a2a32;
        --text-color: #f2f2f5;
        --text-light: #8b8b97;
        --user-msg-bg: rgba(39, 56, 82, 0.85);
        --assistant-msg-bg: rgba(20, 22, 44, 0.8);
        --code-bg: #0c0c12;
        --accent: linear-gradient(
          270deg,
          #e85d4c,
          #e8a84c,
          #4cb8e8,
          #6c5ce7
        );
      }

      * {
        box-sizing: border-box;
      }

      body {
        font-family: "DM Sans", system-ui, sans-serif;
        line-height: 1.6;
        color: var(--text-color);
        background:
          radial-gradient(ellipse at top, #12122a 0%, transparent 55%),
          var(--light-bg);
        max-width: min(1520px, 100%);
        width: 100%;
        margin: 0 auto;
        padding: 0.85rem 1.25rem 1.5rem;
        min-height: 100vh;
      }

      .spectrum-strip {
        height: 4px;
        background: var(--accent);
        background-size: 400% 400%;
        animation: slide 8s ease infinite;
        border-radius: 2px;
      }

      @keyframes slide {
        0% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
        100% {
          background-position: 0% 50%;
        }
      }

      header {
        text-align: center;
        margin-bottom: 0.65rem;
        padding: 0.55rem 0 0.75rem;
        border-bottom: 1px solid var(--border-color);
      }

      h1 {
        font-size: 1.85rem;
        letter-spacing: 0.08em;
        margin: 0 0 0.25rem;
      }

      header p {
        margin: 0;
        color: var(--text-light);
        font-size: 0.92rem;
      }

      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        align-items: center;
        margin-bottom: 0.65rem;
      }

      .toolbar label {
        font-size: 0.85rem;
        color: var(--text-light);
      }

      #model-select {
        flex: 1;
        min-width: 180px;
        background: #0a0a10;
        color: var(--text-color);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        padding: 0.45rem 0.6rem;
        font: inherit;
      }

      .hint {
        width: 100%;
        font-size: 0.8rem;
        color: var(--text-light);
        margin: 0;
      }

      .chat-container {
        display: flex;
        flex-direction: column;
        height: calc(100vh - 200px);
        min-height: 520px;
        border: 1.5px solid var(--border-color);
        border-radius: 16px;
        overflow: hidden;
        background: rgba(20, 22, 44, 0.7);
        box-shadow: 0 8px 40px #16161a;
        backdrop-filter: blur(8px);
      }

      .chat-messages {
        flex: 1;
        overflow-y: auto;
        padding: 1rem;
        background: linear-gradient(120deg, #000 60%, #111 100%);
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
      }

      .message {
        margin-bottom: 0.75rem;
        padding: 0.95rem;
        border-radius: 12px;
        max-width: 85%;
        font-size: 1.02rem;
        word-wrap: break-word;
        overflow-wrap: anywhere;
      }

      .user-message {
        background: var(--user-msg-bg);
        align-self: flex-end;
        margin-left: auto;
        color: #eaf2fb;
      }

      .assistant-message {
        background: var(--assistant-msg-bg);
        align-self: flex-start;
        color: #bbc8e7;
        animation: fadeInUp 0.45s ease;
      }

      .assistant-message.streaming::after {
        content: "▍
        animation: blink 1s step-end infinite;
        margin-left: 2px;
        opacity: 0.7;
      }

      @keyframes blink {
        50% {
          opacity: 0;
        }
      }

      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .message p {
        margin: 0 0 0.65rem;
      }

      .message p:last-child {
        margin-bottom: 0;
      }

      .message ul,
      .message ol {
        margin: 0.4rem 0 0.65rem 1.2rem;
        padding: 0;
      }

      .message pre {
        position: relative;
        background: var(--code-bg);
        border: 1px solid var(--border-color);
        border-radius: 10px;
        padding: 0.85rem 1rem;
        overflow-x: auto;
        margin: 0.65rem 0;
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        font-size: 0.88rem;
        line-height: 1.45;
      }

      .message code {
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        font-size: 0.9em;
        background: rgba(255, 255, 255, 0.06);
        padding: 0.1em 0.35em;
        border-radius: 4px;
      }

      .message pre code {
        background: none;
        padding: 0;
        font-size: inherit;
        color: #d7dce8;
      }

      .code-copy {
        position: absolute;
        top: 0.45rem;
        right: 0.45rem;
        font: inherit;
        font-size: 0.72rem;
        padding: 0.2rem 0.45rem;
        border-radius: 6px;
        border: 1px solid var(--border-color);
        background: #1a1a24;
        color: var(--text-light);
        cursor: pointer;
      }

      .code-copy:hover {
        color: #fff;
        border-color: #555;
      }

      .message img.generated-image {
        display: block;
        max-width: min(100%, 420px);
        width: 100%;
        border-radius: 12px;
        margin-top: 0.5rem;
        opacity: 0;
        transform: scale(0.97);
        transition: opacity 0.45s ease, transform 0.45s ease;
      }

      .message img.generated-image.loaded {
        opacity: 1;
        transform: scale(1);
      }

      .image-gen-card {
        width: min(100%, 420px);
        margin-top: 0.35rem;
      }

      .image-skeleton {
        width: 100%;
        aspect-ratio: 1;
        border-radius: 12px;
        background: linear-gradient(
          110deg,
          #12121c 25%,
          #1c1c2e 37%,
          #12121c 63%
        );
        background-size: 200% 100%;
        animation: shimmer 1.4s ease-in-out infinite;
        border: 1px solid var(--border-color);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 0.75rem;
        color: var(--text-light);
        font-size: 0.9rem;
      }

      .image-skeleton .orbit {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        border: 2px solid rgba(108, 140, 255, 0.25);
        border-top-color: #6c8cff;
        animation: spin 0.9s linear infinite;
      }

      @keyframes shimmer {
        0% {
          background-position: 200% 0;
        }
        100% {
          background-position: -200% 0;
        }
      }

      .work-bar {
        height: 3px;
        width: 100%;
        background: transparent;
        overflow: hidden;
        opacity: 0;
        transition: opacity 0.2s;
        pointer-events: none;
      }

      .chat-container.processing .work-bar {
        opacity: 1;
      }

      .work-bar::after {
        content: "";
        display: block;
        height: 100%;
        width: 40%;
        background: linear-gradient(90deg, transparent, #6c8cff, #4cb8e8, transparent);
        animation: workSlide 1.1s ease-in-out infinite;
      }

      @keyframes workSlide {
        0% {
          transform: translateX(-120%);
        }
        100% {
          transform: translateX(320%);
        }
      }

      .download-btn {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        margin-top: 0.65rem;
        padding: 0.4rem 0.9rem;
        background: #1a1a2e;
        border: 1px solid #3a3a5a;
        color: #9fd4ff;
        border-radius: 8px;
        font-size: 0.85rem;
        text-decoration: none;
        cursor: pointer;
        transition: all 0.2s;
      }

      .download-btn:hover {
        background: #252542;
        border-color: #6c8cff;
        color: #fff;
      }

      .message-input {
        display: flex;
        gap: 0.5rem;
        padding: 0.75rem;
        border-top: 1px solid var(--border-color);
        background: rgba(15, 23, 42, 0.9);
        align-items: flex-end;
      }

      #user-input {
        flex: 1;
        padding: 0.75rem;
        border: 1.5px solid var(--border-color);
        border-radius: 8px;
        background: #000;
        color: var(--text-color);
        resize: none;
        min-height: 44px;
        max-height: 160px;
        outline: none;
        font: inherit;
      }

      #user-input:focus {
        border-color: #6c8cff;
      }

      .btn {
        padding: 0 1rem;
        min-height: 44px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
        font-size: 0.95rem;
        font-family: inherit;
      }

      #send-button {
        background: var(--accent);
        background-size: 200% 200%;
        color: #fff;
      }

      #send-button:disabled {
        background: #222;
        color: #666;
        cursor: not-allowed;
      }

      #stop-button {
        display: none;
        background: #3a1520;
        color: #ffb4c0;
        border: 1px solid #6a2a3a;
      }

      #stop-button.visible {
        display: inline-flex;
        align-items: center;
      }

      #image-mode-button {
        background: #12121c;
        color: var(--text-light);
        border: 1px solid var(--border-color);
      }

      #image-mode-button.active {
        color: #9fd4ff;
        border-color: #3a6a9a;
        background: #0e1a28;
      }

      .typing-indicator {
        display: none;
        padding: 0 1rem 0.5rem;
        font-style: italic;
        color: var(--text-light);
        font-size: 0.9rem;
      }

      .typing-indicator.visible {
        display: block;
      }

      footer {
        margin-top: 1rem;
        text-align: center;
        font-size: 0.9rem;
        color: var(--text-light);
      }

      .chat-container.processing {
        box-shadow: 0 0 25px rgba(108, 140, 255, 0.25), 0 8px 40px #16161a;
        border-color: rgba(108, 140, 255, 0.5);
        animation: containerPulse 2s infinite ease-in-out;
      }

      .chat-container.processing.imaging {
        box-shadow: 0 0 28px rgba(232, 168, 76, 0.28), 0 8px 40px #16161a;
        border-color: rgba(232, 168, 76, 0.55);
      }

      .chat-container.processing.agenting {
        box-shadow: 0 0 28px rgba(76, 175, 80, 0.25), 0 8px 40px #16161a;
        border-color: rgba(76, 175, 80, 0.55);
      }

      #agent-mode-button {
        background: #12121c;
        color: var(--text-light);
        border: 1px solid var(--border-color);
      }

      #agent-mode-button.active {
        color: #9dffb0;
        border-color: #3a9a5a;
        background: #0e2818;
      }

      .api-key-label {
        font-size: 0.85rem;
        color: var(--text-light);
      }

      #api-key-input {
        min-width: 140px;
        flex: 0 1 200px;
        background: #0a0a10;
        color: var(--text-color);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        padding: 0.45rem 0.6rem;
        font: inherit;
        font-size: 0.85rem;
      }

      #api-key-input:focus {
        outline: none;
        border-color: #6c8cff;
      }

      .agent-final {
        border-top: 1px solid var(--border-color);
        padding-top: 0.65rem;
        margin-top: 0.35rem;
      }

      .agent-meta {
        font-family: "IBM Plex Mono", monospace;
        font-size: 0.72rem;
        color: var(--text-light);
        border-top: 1px dashed var(--border-color);
        padding-top: 0.4rem;
        margin-top: 0.55rem;
        opacity: 0.85;
      }

      .doc-download-note {
        padding: 0.35rem 0.7rem 0.55rem;
        font-size: 0.78rem;
        color: #9dffb0;
      }

      body.is-working .spectrum-strip {
        animation-duration: 1.6s;
        height: 5px;
      }

      @keyframes containerPulse {
        0%, 100% { border-color: rgba(108, 140, 255, 0.3); }
        50% { border-color: rgba(108, 140, 255, 0.7); }
      }

      .slash-suggestions {
        position: absolute;
        bottom: 100%;
        left: 0.75rem;
        right: 0.75rem;
        background: #141422;
        border: 1px solid var(--border-color);
        border-radius: 10px;
        box-shadow: 0 -8px 24px rgba(0,0,0,0.6);
        overflow: hidden;
        z-index: 100;
        max-height: 220px;
        overflow-y: auto;
        display: none;
        margin-bottom: 0.5rem;
        animation: slashPop 0.16s ease-out;
      }

      @keyframes slashPop {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .slash-suggestion-item {
        padding: 0.65rem 1rem;
        cursor: pointer;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 0.9rem;
        border-bottom: 1px solid rgba(255,255,255,0.04);
      }

      .slash-suggestion-item:hover, .slash-suggestion-item.active {
        background: rgba(108, 140, 255, 0.2);
        color: #fff;
      }

      .slash-suggestion-item code {
        color: #9fd4ff;
        font-family: "IBM Plex Mono", monospace;
        font-weight: 500;
      }

      .slash-suggestion-item span {
        color: var(--text-light);
        font-size: 0.8rem;
      }

      .suggestion-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem;
        margin-top: 0.75rem;
      }

      .suggestion-chip {
        background: rgba(108, 140, 255, 0.12);
        border: 1px solid rgba(108, 140, 255, 0.3);
        color: #b8d0ff;
        padding: 0.35rem 0.75rem;
        border-radius: 16px;
        font-size: 0.85rem;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .suggestion-chip:hover {
        background: rgba(108, 140, 255, 0.25);
        border-color: #6c8cff;
        color: #fff;
        transform: translateY(-1px);
      }

      .ask-user-prompt {
        margin: 0.5rem 0 0.25rem;
        padding: 0.65rem 0.75rem;
        background: rgba(108, 140, 255, 0.08);
        border: 1px solid rgba(108, 140, 255, 0.35);
        border-radius: 10px;
      }

      .ask-user-prompt .ask-question {
        font-weight: 600;
        margin: 0 0 0.55rem;
        color: #dfe8ff;
      }

      .option-buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
      }

      .option-button {
        flex: 1 1 auto;
        min-width: 110px;
        padding: 0.65rem 0.9rem;
        background: #1a1a2e;
        border: 1px solid #3a3a5a;
        color: #c9d4f0;
        border-radius: 10px;
        font: inherit;
        font-size: 0.92rem;
        cursor: pointer;
        transition: all 0.18s ease;
        text-align: center;
      }

      .option-button:hover {
        background: rgba(108, 140, 255, 0.28);
        border-color: #6c8cff;
        color: #fff;
        transform: translateY(-1px);
      }

      .option-button:active {
        transform: scale(0.97);
      }

      .plan-card,
      .confirm-card {
        margin: 0.75rem 0;
        padding: 0.85rem 1rem;
        border: 1px solid rgba(0, 0, 0, 0.12);
        background: rgba(255, 248, 230, 0.9);
        border-radius: 6px;
      }
      .plan-card .plan-meta {
        opacity: 0.75;
        font-size: 0.9em;
        margin: 0.25rem 0 0.6rem;
      }
      .plan-label {
        display: block;
        font-size: 0.8em;
        margin-top: 0.45rem;
        opacity: 0.8;
      }
      .plan-card textarea {
        width: 100%;
        box-sizing: border-box;
        margin-top: 0.2rem;
        font: inherit;
        padding: 0.4rem;
      }
      .plan-actions {
        display: flex;
        gap: 0.5rem;
        margin-top: 0.65rem;
      }
      #agent-resume.pulse {
        box-shadow: 0 0 0 2px #c45c26;
        font-weight: 600;
      }
      .file-drop {
        margin: 0.5rem 0 0.75rem;
        padding: 0.75rem;
        border: 1px dashed rgba(0, 0, 0, 0.25);
        border-radius: 6px;
        font-size: 0.85em;
        opacity: 0.85;
        text-align: center;
        cursor: pointer;
      }
      .file-drop.dragover {
        border-color: #c45c26;
        background: rgba(196, 92, 38, 0.08);
      }
      .action-trace {
        margin: 0.4rem 0;
        padding: 0.5rem 0.65rem;
        border-left: 3px solid #6c8cff;
        background: rgba(108, 140, 255, 0.08);
        font-size: 0.85em;
        white-space: pre-wrap;
      }
      .login-pause-card {
        margin: 0.75rem 0;
        padding: 0.85rem 1rem;
        border: 1px solid rgba(196, 92, 38, 0.45);
        background: rgba(255, 248, 230, 0.95);
        border-radius: 6px;
      }

      .connector-prompt {
        margin: 0.5rem 0 0.25rem;
        display: flex;
        flex-direction: column;
        gap: 0.4rem;
      }

      .connector-card {
        display: flex;
        flex-direction: column;
        gap: 0.15rem;
        padding: 0.6rem 0.75rem;
        background: rgba(20, 22, 44, 0.85);
        border: 1px solid var(--border-color);
        border-radius: 10px;
      }

      .connector-card .connector-name {
        font-weight: 600;
        color: #9fd4ff;
        font-size: 0.95rem;
      }

      .connector-card .connector-desc {
        font-size: 0.82rem;
        color: var(--text-light);
      }

      .connector-actions {
        display: flex;
        gap: 0.5rem;
        margin-top: 0.35rem;
        flex-wrap: wrap;
      }

      .connector-actions button {
        padding: 0.4rem 0.85rem;
        border-radius: 8px;
        border: 1px solid var(--border-color);
        background: #12121c;
        color: var(--text-light);
        font: inherit;
        font-size: 0.85rem;
        cursor: pointer;
        transition: all 0.18s ease;
      }

      .connector-actions .connect-btn {
        background: #1a3a28;
        border-color: #3a9a5a;
        color: #9dffb0;
      }

      .connector-actions .connect-btn:hover {
        background: #0e2818;
        border-color: #6cff9d;
      }

      .connector-actions .use-btn {
        background: #0e1a28;
        border-color: #3a6a9a;
        color: #9fd4ff;
      }

      .connector-actions .use-btn:hover {
        border-color: #6c8cff;
      }

      .connector-actions .none-btn:hover {
        color: #fff;
        border-color: #555;
      }

      .connector-state {
        font-size: 0.78rem;
        color: #9dffb0;
      }

      .spinner {
        display: inline-block;
        width: 14px;
        height: 14px;
        border: 2px solid rgba(255,255,255,0.3);
        border-radius: 50%;
        border-top-color: #fff;
        animation: spin 0.8s linear infinite;
        margin-right: 6px;
        vertical-align: middle;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      .terminal-panel {
        border-top: 1px solid var(--border-color);
        background: #0a0a12;
        height: 280px;
        display: flex;
        flex-direction: column;
        flex-shrink: 0;
      }

      .terminal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0.3rem 0.75rem;
        background: #12121c;
        border-bottom: 1px solid var(--border-color);
        font-size: 0.8rem;
        color: var(--text-light);
      }

      .terminal-header span {
        font-family: "IBM Plex Mono", monospace;
      }

      .terminal-close {
        background: none;
        border: none;
        color: var(--text-light);
        cursor: pointer;
        font-size: 1.2rem;
        padding: 0 0.3rem;
        line-height: 1;
      }

      .terminal-close:hover {
        color: #fff;
      }

      #terminal-container {
        flex: 1;
        overflow: hidden;
      }

      #terminal-toggle {
        background: #12121c;
        color: var(--text-light);
        border: 1px solid var(--border-color);
      }

      #terminal-toggle.active {
        color: #9fd4ff;
        border-color: #3a6a9a;
        background: #0e1a28;
      }

      .terminal-output-block {
        background: #0c0c12;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        margin: 0.5rem 0;
        overflow: hidden;
      }

      .terminal-output-header {
        padding: 0.3rem 0.65rem;
        background: #12121c;
        border-bottom: 1px solid var(--border-color);
        font-size: 0.75rem;
        color: var(--text-light);
        font-family: "IBM Plex Mono", monospace;
        display: flex;
        justify-content: space-between;
      }

      .terminal-output-body {
        padding: 0.5rem 0.65rem;
        font-family: "IBM Plex Mono", monospace;
        font-size: 0.85rem;
        white-space: pre-wrap;
        word-break: break-all;
        color: #d7dce8;
        max-height: 300px;
        overflow-y: auto;
      }

      .terminal-output-body.error {
        color: #ff6b6b;
      }

      .agent-body {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }

      .agent-text {
        font-size: 0.98rem;
      }

      .agent-text p {
        margin: 0 0 0.5rem;
      }

      .tool-call {
        background: #0d0d18;
        border: 1px solid var(--border-color);
        border-radius: 10px;
        overflow: hidden;
        margin: 0.35rem 0;
      }

      .tool-call-header {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.45rem 0.7rem;
        background: #131324;
        border-bottom: 1px solid var(--border-color);
        font-family: "IBM Plex Mono", monospace;
        font-size: 0.82rem;
      }

      .tool-icon { color: #6c8cff; }
      .tool-name { color: #9fd4ff; font-weight: 500; }

      .tool-status {
        margin-left: auto;
        font-size: 0.72rem;
        padding: 0.1rem 0.5rem;
        border-radius: 8px;
      }
      .tool-status.running { color: #ffd700; background: rgba(255,215,0,0.12); }
      .tool-status.done { color: #4caf50; background: rgba(76,175,80,0.12); }
      .tool-status.error { color: #ff6b6b; background: rgba(255,107,107,0.12); }

      .tool-call-detail {
        padding: 0.45rem 0.7rem;
        font-size: 0.78rem;
        color: var(--text-light);
        border-bottom: 1px solid var(--border-color);
        font-family: "IBM Plex Mono", monospace;
        word-break: break-all;
      }

      .tool-call-result {
        padding: 0.45rem 0.7rem;
        font-family: "IBM Plex Mono", monospace;
        font-size: 0.78rem;
        color: #d7dce8;
        white-space: pre-wrap;
        word-break: break-all;
        max-height: 250px;
        overflow-y: auto;
        background: #0a0a14;
      }

      .tool-call-result.error {
        color: #ff6b6b;
      }

      .app-shell {
        display: grid;
        grid-template-columns: minmax(240px, 280px) minmax(0, 1fr) minmax(280px, 340px);
        gap: 0.9rem;
        align-items: stretch;
        width: 100%;
        position: relative;
      }

      .sheet-backdrop {
        display: none;
      }

      .app-shell:not(.hide-threads).hide-files.hide-browser {
        grid-template-columns: minmax(240px, 280px) minmax(0, 1fr);
      }
      .app-shell:not(.hide-threads).hide-files:not(.hide-browser) {
        grid-template-columns: minmax(240px, 280px) minmax(0, 1fr) minmax(260px, 300px);
      }
      .app-shell.hide-threads:not(.hide-files).hide-browser {
        grid-template-columns: 2.1rem minmax(0, 1fr) minmax(280px, 340px);
      }
      .app-shell.hide-threads:not(.hide-files):not(.hide-browser) {
        grid-template-columns: 2.1rem minmax(0, 1fr) minmax(280px, 320px) minmax(260px, 300px);
      }
      .app-shell.hide-threads.hide-files.hide-browser {
        grid-template-columns: 2.1rem minmax(0, 1fr);
      }
      .app-shell.hide-threads.hide-files:not(.hide-browser) {
        grid-template-columns: 2.1rem minmax(0, 1fr) minmax(260px, 300px);
      }

      .panel-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.4rem;
      }
      .panel-head h2 {
        margin: 0;
      }
      .panel-collapse {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 1.85rem;
        height: 1.85rem;
        padding: 0;
        border-radius: 8px;
        border: 1px solid var(--border-color);
        background: #12121c;
        color: var(--text-light);
        cursor: pointer;
        flex-shrink: 0;
      }
      .panel-collapse:hover {
        color: var(--text-color);
        border-color: #3a3a48;
      }
      .threads-rail {
        display: none;
        align-items: center;
        justify-content: center;
        width: 2.1rem;
        min-height: 4rem;
        padding: 0.4rem 0;
        border-radius: 10px;
        border: 1px solid var(--border-color);
        background: rgba(20, 22, 44, 0.85);
        color: var(--text-light);
        cursor: pointer;
        align-self: start;
        position: sticky;
        top: 0.5rem;
        z-index: 5;
      }
      .app-shell.hide-threads .threads-rail {
        display: inline-flex;
      }
      #toggle-threads[aria-pressed="true"],
      #toggle-threads-bar[aria-pressed="true"] {
        color: var(--text-color);
        border-color: #4a4a5a;
        background: rgba(76, 184, 232, 0.12);
      }

      .side-panel {
        background: rgba(20, 22, 44, 0.55);
        border: 1px solid var(--border-color);
        border-radius: 14px;
        padding: 0.75rem;
        height: calc(100vh - 200px);
        min-height: 520px;
        max-height: none;
        overflow: auto;
        display: flex;
        flex-direction: column;
        gap: 0.45rem;
      }

      .side-panel h2 {
        margin: 0;
        font-size: 0.85rem;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--text-light);
      }

      .panel-actions {
        display: flex;
        gap: 0.35rem;
        flex-wrap: wrap;
      }

      .panel-actions .btn {
        min-height: 32px;
        padding: 0 0.65rem;
        font-size: 0.8rem;
        background: #12121c;
        color: var(--text-light);
        border: 1px solid var(--border-color);
      }

      .panel-empty {
        color: var(--text-light);
        font-size: 0.85rem;
        margin: 0.4rem 0;
      }

      .thread-item,
      .file-item {
        display: flex;
        gap: 0.25rem;
        width: 100%;
        text-align: left;
        background: transparent;
        border: 1px solid transparent;
        border-radius: 8px;
        color: inherit;
        padding: 0.35rem;
      }

      .thread-item {
        flex-direction: column;
        cursor: pointer;
      }

      .thread-item strong {
        font-size: 0.88rem;
      }

      .thread-item span {
        font-size: 0.72rem;
        color: var(--text-light);
      }

      .thread-item:hover,
      .thread-item.active,
      .file-item.active {
        border-color: #3a6a9a;
        background: #0e1a28;
      }

      .file-item .file-open {
        flex: 1;
        background: none;
        border: none;
        color: #c9d4f0;
        text-align: left;
        cursor: pointer;
        font: inherit;
        font-size: 0.78rem;
        word-break: break-all;
      }

      .file-item .file-diff,
      .file-item .file-dl {
        background: #12121c;
        border: 1px solid var(--border-color);
        color: var(--text-light);
        border-radius: 6px;
        cursor: pointer;
        font-size: 0.75rem;
      }

      #file-viewer-path {
        font-size: 0.75rem;
        color: var(--text-light);
        word-break: break-all;
      }

      #file-viewer {
        flex: 1;
        min-height: 160px;
        max-height: none;
        overflow: auto;
        background: #0a0a12;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        padding: 0.5rem;
        font-family: "IBM Plex Mono", monospace;
        font-size: 0.75rem;
        white-space: pre-wrap;
      }

      .api-status {
        font-size: 0.78rem;
        padding: 0.35rem 0.55rem;
        border-radius: 999px;
        border: 1px solid var(--border-color);
        color: var(--text-light);
        white-space: nowrap;
      }
      .api-status.ok {
        color: #9dffb0;
        border-color: #3a9a5a;
        background: #0e2818;
      }
      .api-status.bad {
        color: #ffb4c0;
        border-color: #6a2a3a;
        background: #2a1218;
      }
      .api-status.pending {
        color: #ffd78a;
        border-color: #6a5a2a;
      }
      .api-status.off {
        color: var(--text-light);
      }

      #usage-meter {
        font-size: 0.78rem;
        color: #9fd4ff;
        font-family: "IBM Plex Mono", monospace;
      }

      .main-column {
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        height: calc(100vh - 200px);
        min-height: 520px;
      }

      .main-column .chat-container {
        flex: 1;
        height: 100%;
        min-height: 0;
      }

      .diff-modal {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.65);
        z-index: 200;
        align-items: center;
        justify-content: center;
        padding: 1rem;
      }
      .diff-modal.open {
        display: flex;
      }
      .diff-modal-card {
        width: min(900px, 100%);
        max-height: 80vh;
        overflow: auto;
        background: #101018;
        border: 1px solid var(--border-color);
        border-radius: 12px;
        padding: 1rem;
      }
      .diff-modal-card pre {
        white-space: pre-wrap;
        font-family: "IBM Plex Mono", monospace;
        font-size: 0.8rem;
      }

      .token-stream {
        font-family: "IBM Plex Mono", monospace;
        font-size: 0.85rem;
        color: #a8b4d4;
        white-space: pre-wrap;
        min-height: 1.2em;
      }

      .panel-toggle-bar {
        display: none;
        gap: 0.4rem;
        margin-bottom: 0.5rem;
        flex-wrap: wrap;
      }

      .thread-item {
        position: relative;
      }

      .thread-item .thread-open {
        display: flex;
        flex-direction: column;
        gap: 0.15rem;
        width: 100%;
        text-align: left;
        background: transparent;
        border: none;
        color: inherit;
        cursor: pointer;
        padding: 0.2rem 0.15rem;
        font: inherit;
      }

      .thread-actions {
        display: flex;
        gap: 0.25rem;
        justify-content: flex-end;
      }

      .thread-actions button,
      .file-item .file-ask {
        background: #12121c;
        border: 1px solid var(--border-color);
        color: var(--text-light);
        border-radius: 6px;
        cursor: pointer;
        font-size: 0.75rem;
        min-width: 1.6rem;
      }

      #agent-resume {
        background: #1a3a28;
        border-color: #3a9a5a;
        color: #9dffb0;
      }

      .app-shell.hide-threads #threads-panel,
      .app-shell.hide-files #files-panel {
        display: none;
      }

      @media (max-width: 960px) {
        .panel-toggle-bar {
          display: flex;
        }
        body {
          padding: 0.75rem;
        }
        .app-shell {
          grid-template-columns: 1fr;
        }
        .app-shell:not(.hide-threads):not(.hide-files) {
          grid-template-columns: 1fr;
        }
        .side-panel {
          height: auto;
          min-height: 0;
          max-height: 260px;
        }
        .main-column {
          height: auto;
          min-height: 0;
        }
        .main-column .chat-container,
        .chat-container {
          height: calc(100vh - 280px);
          min-height: 420px;
        }
      }

      @media (max-width: 560px) {
        .message {
          max-width: 95%;
        }
        .chat-container,
        .main-column .chat-container {
          height: calc(100vh - 300px);
          min-height: 360px;
        }
        .terminal-panel {
          height: 200px;
        }
      }

      @media (min-width: 1100px) {
        body {
          padding: 1rem 1.75rem 1.75rem;
        }
      }

      @media (min-width: 1400px) {
        body {
          max-width: min(1680px, 98vw);
        }
        .app-shell:not(.hide-threads):not(.hide-files):not(.hide-browser) {
          grid-template-columns: 280px minmax(0, 1fr) 320px 300px;
          gap: 1rem;
        }
      }

      /* ── UI advancements ───────────────────────────────────────── */
      .mode-control {
        display: inline-flex;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        overflow: hidden;
      }
      .mode-control button {
        background: transparent;
        color: var(--text-light);
        border: 0;
        padding: 0.4rem 0.75rem;
        font: inherit;
        cursor: pointer;
      }
      .mode-control button.active {
        background: rgba(232, 168, 76, 0.18);
        color: var(--text-color);
        font-weight: 600;
      }
      .toolbar-more {
        position: relative;
      }
      .toolbar-more summary {
        list-style: none;
        cursor: pointer;
        padding: 0.4rem 0.7rem;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        color: var(--text-light);
      }
      .toolbar-more[open] summary {
        color: var(--text-color);
      }
      .toolbar-more .more-menu {
        position: absolute;
        right: 0;
        top: 110%;
        z-index: 40;
        min-width: 180px;
        background: #0c0c12;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        padding: 0.4rem;
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
      }
      #status-strip {
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem;
        margin: 0 0 0.55rem;
        min-height: 0;
      }
      .status-chip {
        border: 1px solid var(--border-color);
        background: rgba(255,255,255,0.03);
        color: var(--text-color);
        border-radius: 999px;
        padding: 0.25rem 0.7rem;
        font-size: 0.8rem;
        cursor: pointer;
      }
      .status-chip.warn {
        border-color: rgba(232, 168, 76, 0.55);
        background: rgba(232, 168, 76, 0.12);
      }
      .status-chip.ok {
        border-color: rgba(76, 184, 120, 0.45);
      }
      #budget-bar {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        margin: 0 0 0.55rem;
      }
      #budget-bar-track {
        flex: 1;
        height: 6px;
        background: #1a1a22;
        border-radius: 99px;
        overflow: hidden;
      }
      #budget-bar-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #e8a84c, #e85d4c);
        transition: width 0.35s ease;
      }
      #budget-bar-label {
        font-size: 0.78rem;
        color: var(--text-light);
        white-space: nowrap;
      }
      #starter-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem;
        margin: 0 0 0.45rem;
      }
      .starter-chip {
        border: 1px solid var(--border-color);
        background: rgba(255,255,255,0.03);
        color: var(--text-color);
        border-radius: 999px;
        padding: 0.3rem 0.75rem;
        font: inherit;
        font-size: 0.85rem;
        cursor: pointer;
        transition: transform 0.15s ease, border-color 0.15s ease;
      }
      .starter-chip:hover {
        border-color: #e8a84c;
        transform: translateY(-1px);
      }
      #artifact-rail {
        display: flex;
        gap: 0.5rem;
        overflow-x: auto;
        padding: 0.35rem 0 0.55rem;
      }
      .artifact-card {
        min-width: 160px;
        max-width: 220px;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        padding: 0.55rem 0.65rem;
        background: rgba(20, 22, 34, 0.9);
      }
      .artifact-kind {
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--text-light);
      }
      .artifact-title {
        font-size: 0.88rem;
        margin: 0.2rem 0 0.45rem;
        word-break: break-word;
      }
      .artifact-actions {
        display: flex;
        gap: 0.35rem;
      }
      .run-timeline {
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
        margin: 0.25rem 0 0.5rem;
      }
      .timeline-item {
        border: 1px solid var(--border-color);
        border-radius: 8px;
        background: rgba(12, 12, 18, 0.7);
        overflow: hidden;
      }
      .timeline-item.enter {
        animation: rise-in 0.35s ease;
      }
      @keyframes rise-in {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: none; }
      }
      .timeline-head {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        background: transparent;
        border: 0;
        color: inherit;
        font: inherit;
        padding: 0.45rem 0.65rem;
        cursor: pointer;
        text-align: left;
      }
      .timeline-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #e8a84c;
        flex: 0 0 auto;
      }
      .timeline-analyze .timeline-dot { background: #4cb8e8; }
      .timeline-plan .timeline-dot { background: #e8a84c; }
      .timeline-tool .timeline-dot { background: #8b8b97; }
      .timeline-critique .timeline-dot { background: #e85d4c; }
      .timeline-answer .timeline-dot { background: #4caf7a; }
      .timeline-body {
        padding: 0 0.65rem 0.55rem 1.5rem;
      }
      .tool-call.collapsed .tool-call-result {
        display: none;
      }
      .tool-call.open .tool-call-result,
      .timeline-item.open .tool-call-result {
        display: block;
      }
      .tool-shot-thumb {
        display: block;
        max-width: 180px;
        margin-top: 0.4rem;
        border-radius: 6px;
        border: 1px solid var(--border-color);
      }
      #browser-pane-img {
        width: 100%;
        border-radius: 8px;
        border: 1px solid var(--border-color);
        background: #000;
      }
      #browser-pane-img.flash {
        animation: shot-in 0.4s ease;
      }
      @keyframes shot-in {
        from { opacity: 0.4; transform: scale(0.98); }
        to { opacity: 1; transform: none; }
      }
      #browser-pane-empty {
        color: var(--text-light);
        font-size: 0.88rem;
        padding: 1rem 0.25rem;
      }
      #browser-pane-meta {
        font-size: 0.78rem;
        color: var(--text-light);
        margin-top: 0.4rem;
        word-break: break-all;
      }
      #plan-drawer {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.45);
        z-index: 80;
        display: none;
        align-items: stretch;
        justify-content: flex-end;
      }
      #plan-drawer.open { display: flex; }
      #plan-drawer-panel {
        width: min(420px, 100%);
        background: #0c0c12;
        border-left: 1px solid var(--border-color);
        padding: 1rem;
        overflow: auto;
        animation: slide-drawer 0.28s ease;
      }
      @keyframes slide-drawer {
        from { transform: translateX(24px); opacity: 0.6; }
        to { transform: none; opacity: 1; }
      }
      .empty-state {
        max-width: 520px;
        margin: 2rem auto;
        text-align: left;
        padding: 1.25rem 1.4rem;
        border: 1px solid var(--border-color);
        border-radius: 10px;
        background: rgba(20, 22, 34, 0.75);
      }
      .empty-state h2 {
        margin: 0 0 0.4rem;
        font-size: 1.35rem;
        letter-spacing: 0.06em;
      }
      .empty-steps {
        color: var(--text-light);
        padding-left: 1.1rem;
      }
      .empty-actions {
        display: flex;
        gap: 0.5rem;
        margin-top: 0.85rem;
      }
      .app-shell.hide-browser #browser-panel { display: none; }
      .file-preview-md {
        white-space: normal;
        line-height: 1.55;
      }
      #file-upload-progress {
        font-size: 0.8rem;
        color: var(--text-light);
        margin: 0.25rem 0;
      }
      .legacy-mode-btns { display: none; }

      /* Lucide / Tippy / Notyf integration */
      .ui-icon,
      i[data-lucide],
      svg.lucide,
      svg.lucide-icon {
        display: inline-block;
        vertical-align: -0.2em;
        flex-shrink: 0;
      }
      .btn,
      .mode-control button,
      .starter-chip,
      .status-chip,
      .panel-actions .btn,
      .toolbar-more > summary,
      #send-button,
      #stop-button,
      .side-panel > h2,
      #plan-drawer-panel > h2 {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
      }
      .side-panel > h2,
      #plan-drawer-panel > h2 {
        display: flex;
      }
      .ui-label { line-height: 1; }
      .file-drop-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.45rem;
        pointer-events: none;
      }
      .file-item .file-open {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        text-align: left;
      }
      header h1 {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
      }
      header h1 svg {
        color: #4cb8e8;
      }
      .tippy-box[data-theme~="chatre"] {
        background: #151520;
        color: #f2f2f5;
        border: 1px solid var(--border-color);
        font-size: 0.78rem;
        font-family: "DM Sans", system-ui, sans-serif;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      }
      .tippy-box[data-theme~="chatre"][data-placement^="top"] > .tippy-arrow::before {
        border-top-color: #151520;
      }
      .tippy-box[data-theme~="chatre"][data-placement^="bottom"] > .tippy-arrow::before {
        border-bottom-color: #151520;
      }
      .notyf__toast {
        font-family: "DM Sans", system-ui, sans-serif;
        border: 1px solid var(--border-color);
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.4);
      }
      .notyf__toast--info .notyf__ripple { background: #4cb8e8 !important; }
      .starter-chip svg,
      .status-chip svg {
        width: 14px;
        height: 14px;
      }
      .tool-call-header .tool-icon svg {
        width: 14px;
        height: 14px;
        color: #6c8cff;
      }
      .empty-state .empty-icon {
        margin-bottom: 0.35rem;
        color: #4cb8e8;
      }
      .empty-state .empty-icon svg {
        width: 28px;
        height: 28px;
      }

      @media (max-width: 900px) {
        .app-shell {
          display: block;
        }
        .side-panel {
          position: fixed;
          inset: auto 0 0 0;
          max-height: 72vh;
          z-index: 60;
          border-radius: 14px 14px 0 0;
          transform: translateY(110%);
          transition: transform 0.28s ease;
          box-shadow: 0 -12px 40px rgba(0,0,0,0.45);
        }
        .app-shell.show-threads #threads-panel,
        .app-shell.show-files #files-panel,
        .app-shell.show-browser #browser-panel {
          transform: translateY(0);
        }
        .sheet-backdrop {
          display: none;
          position: fixed;
          inset: 0;
          background: rgba(0,0,0,0.4);
          z-index: 55;
        }
        .app-shell.show-threads .sheet-backdrop,
        .app-shell.show-files .sheet-backdrop,
        .app-shell.show-browser .sheet-backdrop {
          display: block;
        }
        .threads-rail,
        .panel-collapse {
          display: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="spectrum-strip"></div>
    <header>
      <h1><i data-lucide="zap" style="width:1.1em;height:1.1em;vertical-align:-0.12em" aria-hidden="true"></i> Chatre</h1>
      <p>Re-EL AI ChatBot (Maerd Portal)</p>
    </header>

    <div class="toolbar">
      <label for="model-select">Model</label>
      <select id="model-select" aria-label="Model">
        <option value="@cf/meta/llama-3.3-70b-instruct-fp8-fast">
          Llama 3.3 70B (default)
        </option>
        <option value="@cf/meta/llama-3.1-8b-instruct-fp8-fast">
          Llama 3.1 8B Fast
        </option>
        <option value="@cf/meta/llama-3.1-8b-instruct">Llama 3.1 8B</option>
        <option value="@cf/meta/llama-3.2-3b-instruct">Llama 3.2 3B</option>
      </select>
      <div class="mode-control" id="mode-control" role="group" aria-label="Mode">
        <button type="button" data-mode="chat" aria-pressed="false">Chat</button>
        <button type="button" data-mode="agent" class="active" aria-pressed="true">Agent</button>
        <button type="button" data-mode="image" aria-pressed="false">Image</button>
      </div>
      <span class="legacy-mode-btns">
        <button type="button" class="btn" id="image-mode-button" title="Toggle image mode">Image</button>
        <button type="button" class="btn active" id="agent-mode-button" title="Toggle agent mode" aria-pressed="true">Agent</button>
      </span>
      <button type="button" class="btn" id="agent-resume" hidden title="Resume interrupted agent run">
        Resume
      </button>
      <label for="api-key-input" class="api-key-label">API key</label>
      <input
        id="api-key-input"
        type="password"
        autocomplete="off"
        placeholder="CHATRE_API_TOKEN"
        title="Same value as Vercel CHATRE_API_TOKEN"
      />
      <span id="api-status" class="api-status off" aria-live="polite">Local</span>
      <span id="companion-status" class="api-status off" title="Desktop companion" aria-live="polite">Desktop off</span>
      <span id="usage-meter" hidden></span>
      <details class="toolbar-more">
        <summary>More</summary>
        <div class="more-menu">
          <button type="button" class="btn" id="terminal-toggle">Terminal</button>
          <button type="button" class="btn" id="toggle-threads">Threads</button>
          <button type="button" class="btn" id="toggle-files">Files</button>
          <button type="button" class="btn" id="toggle-browser">Browser</button>
        </div>
      </details>
    </div>

    <div id="status-strip" aria-live="polite"></div>
    <div id="budget-bar" hidden>
      <div id="budget-bar-track"><div id="budget-bar-fill"></div></div>
      <span id="budget-bar-label"></span>
    </div>

    <div class="panel-toggle-bar">
      <button type="button" class="btn" id="toggle-threads-bar">Threads</button>
      <button type="button" class="btn" id="toggle-files-bar">Files</button>
      <button type="button" class="btn" id="toggle-browser-bar">Browser</button>
    </div>

    <div class="app-shell hide-browser">
      <div class="sheet-backdrop" id="sheet-backdrop"></div>
      <button
        type="button"
        class="threads-rail"
        id="threads-rail"
        aria-label="Show threads"
        data-tip="Show threads"
      >
        <i data-lucide="panel-left-open" style="width:16px;height:16px" aria-hidden="true"></i>
      </button>
      <aside class="side-panel" id="threads-panel" aria-label="Threads">
        <div class="panel-head">
          <h2>Threads</h2>
          <button
            type="button"
            class="panel-collapse"
            id="threads-collapse"
            aria-label="Collapse threads"
            data-tip="Collapse threads"
          >
            <i data-lucide="panel-left-close" style="width:15px;height:15px" aria-hidden="true"></i>
          </button>
        </div>
        <div class="panel-actions">
          <button type="button" class="btn" id="threads-new">New</button>
          <button type="button" class="btn" id="threads-refresh">Refresh</button>
        </div>
        <div id="thread-list"></div>
      </aside>

      <div class="main-column">
        <div class="chat-container">
          <div class="work-bar" aria-hidden="true"></div>
          <div id="artifact-rail" hidden></div>
          <div id="chat-messages" class="chat-messages" role="log" aria-live="polite"></div>
          <div class="typing-indicator" id="typing-indicator" aria-hidden="true"></div>
          <div id="starter-chips" aria-label="Starters"></div>
          <div class="message-input" style="position: relative;">
            <div id="slash-suggestions" class="slash-suggestions" role="listbox" aria-label="Slash commands"></div>
            <textarea
              id="user-input"
              placeholder="Type a message… or /image a sunset over Cape Town"
              rows="1"
              autofocus
            ></textarea>
            <button type="button" class="btn" id="stop-button">Stop</button>
            <button type="button" class="btn" id="send-button">Send</button>
          </div>
          <div class="terminal-panel" id="terminal-panel" style="display: none;">
            <div class="terminal-header">
              <span>Terminal</span>
              <button class="terminal-close" id="terminal-close">&times;</button>
            </div>
            <div id="terminal-container"></div>
          </div>
        </div>
      </div>

      <aside class="side-panel" id="files-panel" aria-label="Files">
        <h2>Workspace</h2>
        <div class="panel-actions">
          <button type="button" class="btn" id="files-refresh">Refresh</button>
          <button type="button" class="btn" id="files-export-zip">Export ZIP</button>
        </div>
        <div id="file-drop" class="file-drop" tabindex="0" data-tip="Upload files into the remote workspace">
          <div class="file-drop-inner">
            <i data-lucide="upload" style="width:22px;height:22px" aria-hidden="true"></i>
            <span>Drop files here to upload into the workspace</span>
          </div>
          <input type="file" id="file-drop-input" multiple hidden />
        </div>
        <div id="file-upload-progress" hidden></div>
        <div id="file-tree"></div>
        <div id="file-viewer-path"></div>
        <div id="file-viewer" class="file-viewer"></div>
      </aside>

      <aside class="side-panel" id="browser-panel" aria-label="Browser">
        <h2>Browser</h2>
        <div id="browser-pane">
          <p id="browser-pane-empty">Screenshots from navigate/computer appear here during agent runs.</p>
          <img id="browser-pane-img" alt="Live browser screenshot" hidden />
          <div id="browser-pane-meta"></div>
        </div>
      </aside>
    </div>

    <div id="plan-drawer" aria-hidden="true">
      <div id="plan-drawer-panel">
        <h2>Plan</h2>
        <div id="plan-drawer-body"></div>
      </div>
    </div>

    <div class="diff-modal" id="diff-modal" role="dialog" aria-modal="true">
      <div class="diff-modal-card">
        <div class="panel-actions" style="justify-content: space-between;">
          <h2 id="diff-modal-title">Diff</h2>
          <button type="button" class="btn" id="diff-modal-close">Close</button>
        </div>
        <pre id="diff-modal-body"></pre>
      </div>
    </div>

    <footer>
      <p>Re-EL Technologies &copy; 2025</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.4/dist/purify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tippy.js@6.3.7/dist/tippy.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/notyf@3.10.0/notyf.min.js"></script>
    <script src="/ui-libs.js"></script>
    <script src="/config.js"></script>
    <script src="/skills.js"></script>
    <script src="/intent.js"></script>
    <script src="/allowlists.js"></script>
    <script src="/subagents.js"></script>
    <script src="/mcp.js"></script>
    <script src="/tools.js"></script>
    <script src="/analyst.js"></script>
    <script src="/plan-templates.js"></script>
    <script src="/plan-ui.js"></script>
    <script src="/ui-adv.js"></script>
    <script src="/agent.js"></script>
    <script src="/remote.js"></script>
    <script src="/panels.js"></script>
    <script src="/chat.js" defer></script>
  </body>
</html>
